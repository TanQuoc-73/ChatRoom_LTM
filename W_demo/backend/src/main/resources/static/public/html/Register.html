<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - Tái Tạo</title>
    <link rel="stylesheet" href="/api/public/css/register.css" />
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-solid-rounded/css/uicons-solid-rounded.css" />
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css" />
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-bold-rounded/css/uicons-bold-rounded.css" />
</head>
<body>
<video autoplay muted loop id="myVideo">
    <source src="/api/public/background.mp4" type="video/mp4" />
</video>

<div class="container">
    <div class="signup-form-wrapper">
        <div class="signup-header">Đăng Ký</div>

        <form class="signup-form" id="registerForm">
            <!-- 1. THÊM 2 span lỗi cho Họ & Tên (JS đang dùng lastNameError + firstNameError) -->
            <div class="input-row name-fields">
                <input type="text" placeholder="Họ" class="half-width-input" id="lastName" name="lastName" required />
                <input type="text" placeholder="Tên" class="half-width-input" id="firstName" name="firstName" required />
            </div>
            <div class="error-wrapper">
                <span class="error" id="lastNameError"></span>
                <span class="error" id="firstNameError"></span>
            </div>

            <!-- Giới tính & ngày sinh (không bắt buộc) -->
            <div class="input-row gender-fields">
                <label>Giới tính:</label>
                <input type="radio" id="male" name="gender" value="MALE" />
                <label for="male">Nam</label>
                <input type="radio" id="female" name="gender" value="FEMALE" />
                <label for="female">Nữ</label>
            </div>

            <div class="input-row date-field">
                <input type="date" id="dob" name="dob" />
            </div>

            <input type="text" placeholder="Tên đăng nhập" id="username" name="username" required />
            <span class="error" id="usernameError"></span>

            <input type="email" placeholder="Email" id="email" name="email" required />
            <span class="error" id="emailError"></span>

            <input type="password" placeholder="Mật khẩu" id="password" name="password" required />
            <span class="error" id="passwordError"></span>

            <input type="password" placeholder="Nhập lại mật khẩu" id="confirmPassword" required />
            <span class="error" id="confirmPasswordError"></span>

            <button type="submit" class="signup-button" id="btnRegister">Đăng Ký</button>

            <div class="login-link">
                <p>Đã có tài khoản? <a href="/api/public/html/Login.html">Đăng nhập ngay</a></p>
            </div>
        </form>
    </div>
</div>

<script src="/api/public/js/register.js"></script>
</body>
</html>
