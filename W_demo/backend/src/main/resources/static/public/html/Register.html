<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký - Tái Tạo</title>
    <link rel="stylesheet" href="/api/public/css/register.css" />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/uicons-solid-rounded/css/uicons-solid-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn-uicons.flaticon.com/uicons-bold-rounded/css/uicons-bold-rounded.css"
    />
  </head>
  <body>
    <video autoplay muted loop id="myVideo">
      <source src="/api/public/background.mp4" type="video/mp4" />
    </video>

    <div class="container">
      <div class="signup-form-wrapper">
        <div class="signup-header">Đăng Ký</div>

        <form class="signup-form">
          <div class="input-row name-fields">
            <input type="text" placeholder="Họ" class="half-width-input" />
            <input type="text" placeholder="Tên" class="half-width-input" />
          </div>

          <div class="input-row gender-fields">
            <label>Giới tính:</label>
            <input type="radio" id="male" name="gender" value="male" />
            <label for="male">Nam</label>
            <input type="radio" id="female" name="gender" value="female" />
            <label for="female">Nữ</label>
          </div>

          <div class="input-row date-field">
            <input type="text" placeholder="Ngày sinh: dd/mm/yyyy" />
            <span class="calendar-icon"
              ><i class="fi fi-sr-calendar-clock"></i
            ></span>
          </div>

          <input type="text" placeholder="Tên đăng nhập" />
          <input type="email" placeholder="Email" />
          <input type="password" placeholder="Mật Khẩu" />
          <input type="password" placeholder="Nhập Lại Mật Khẩu" />

          <button type="submit" class="signup-button">Đăng Ký</button>

          <div class="login-link">
            <p>
              Đã có tài khoản?
              <a href="/api/public/html/Login.html">Đăng nhập ngay</a>
            </p>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
